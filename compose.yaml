services:
  frontend:
    build: ./frontend
    environment:
      - BACKEND_BASE_URL=http://backend:8080
    depends_on:
      - backend
    ports:
      - 3000:3000
    restart: always
  backend:
    build: ./backend
    expose:
      - 8080:8080
    depends_on:
      - db
    restart: always
    env_file:
      - backend.env
  db:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=5936
      - POSTGRES_DB=Diary
    volumes:
      - ./backend/initDb:/docker-entrypoint-initdb.d
      - /var/lib/postgres:/var/lib/postgresql
    expose:
      - 5432:5432
    restart: always
